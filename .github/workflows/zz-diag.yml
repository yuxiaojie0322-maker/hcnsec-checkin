name: zz-diag

on: [workflow_dispatch]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 探测 checkin 接口（Bearer 认证）
        env:
          HCN_ACCOUNTS: ${{ secrets.HCN_ACCOUNTS }}
        run: |
          cat > /tmp/probe2.py << 'PYEOF'
          import json, os, time
          import urllib.request, urllib.error

          BASE = "https://api.hcnsec.cn"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          raw = (os.environ.get("HCN_ACCOUNTS") or "").strip()
          accs = []
          if raw.startswith("["):
              for it in json.loads(raw):
                  accs.append((str(it.get("username","")), str(it.get("password",""))))
          else:
              for seg in raw.split("|"):
                  seg = seg.strip()
                  if ":" in seg:
                      u, _, p = seg.partition(":")
                      accs.append((u.strip(), p.strip()))
          print("账号数:", len(accs))

          def req(method, path, body=None, extra=None, timeout=30):
              h = {"User-Agent": UA, "Content-Type": "application/json", "Accept": "application/json"}
              if extra:
                  h.update(extra)
              data = json.dumps(body).encode("utf-8") if body is not None else None
              r = urllib.request.Request(BASE + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as resp:
                      return resp.status, resp.headers, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return -1, None, "EXC: %s" % e

          def show(label, method, path, body=None, extra=None):
              print("\n### %s %s %s" % (label, method, path))
              st, hd, t = req(method, path, body, extra)
              print("HTTP:", st)
              try:
                  print("BODY:", json.dumps(json.loads(t), ensure_ascii=False)[:1500])
              except Exception:
                  print("BODY:", t[:1500])
              return st, hd, t

          def login(u, p):
              st, hd, t = req("POST", "/api/user/login", {"username": u, "password": p})
              d = json.loads(t)
              if not d.get("success"):
                  return None
              data = d.get("data", {})
              tok = data.get("access_token")
              user = data.get("user", {})
              sid = (data.get("session") or {}).get("sid")
              refresh_cookie = ""
              for v in (hd.get_all("Set-Cookie") if hd is not None else []):
                  if v.startswith("new_api_refresh="):
                      refresh_cookie = "new_api_refresh=" + v.split("=", 1)[1].split(";")[0]
                      break
              print("login %s: HTTP %s | uid=%s | quota=%s | token_len=%s | sid=%s"
                    % (u, st, user.get("id"), user.get("quota"), len(tok or ""), sid))
              return {"token": tok, "sid": sid, "uid": user.get("id"), "quota": user.get("quota"),
                      "refresh": refresh_cookie, "access_expires_at": data.get("access_expires_at")}

          s = login(accs[0][0], accs[0][1])
          B = {"Authorization": "Bearer " + s["token"]}

          show("SELF", "GET", "/api/user/self", extra=B)
          show("CHK-GET", "GET", "/api/user/checkin", extra=B)

          # 路径探测：哪些 checkin 相关路径真实存在
          print("\n=== 路径探测（仅状态码） ===")
          for m, path in [
              ("GET", "/api/user/checkin"), ("POST", "/api/user/checkin"),
              ("GET", "/api/user/check-in"), ("POST", "/api/user/check-in"),
              ("GET", "/api/user/self/checkin"), ("POST", "/api/user/self/checkin"),
              ("GET", "/api/user/checkin/status"), ("POST", "/api/user/checkin/status"),
              ("GET", "/api/user/checkins"), ("POST", "/api/user/checkins"),
              ("POST", "/api/user/checkin/do"),
              ("GET", "/api/user/daily"), ("POST", "/api/user/daily"),
          ]:
              st, _, t = req(m, path, extra=B)
              body = t[:120].replace("\n", " ")
              print("  %-5s %-32s -> %s  %s" % (m, path, st, body))

          print("\n=== POST /api/user/checkin 执行签到 ===")
          st, _, t = show("CHK-POST-{} ", "POST", "/api/user/checkin", {}, extra=B)
          print("\n=== POST /api/user/checkin 空 body ===")
          show("CHK-POST-NONE", "POST", "/api/user/checkin", None, extra=B)

          print("\n=== 签到后再查一次状态 ===")
          show("CHK-GET-AFTER", "GET", "/api/user/checkin", extra=B)

          print("\n=== refresh token 端点 ===")
          show("REFRESH", "POST", "/api/user/auth/refresh", extra={
              "Cookie": s["refresh"], "X-Auth-Session": s["sid"],
              "User-Agent": UA, "Accept": "application/json"})
          PYEOF
          python3 -u /tmp/probe2.py
