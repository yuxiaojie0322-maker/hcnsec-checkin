name: hcnsec 每日签到

on:
  schedule:
    # 每天 UTC 22:30（北京时间 6:30）运行
    - cron: '30 22 * * *'
  workflow_dispatch:

concurrency:
  group: hcnsec-checkin
  cancel-in-progress: true

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: 检出私有核心仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/my-private-scripts
          path: private-scripts
          token: ${{ secrets.CORE_SCRIPT_TOKEN || secrets.REPO_TOKEN || secrets.GH_PAT_PRIVATE_REPO }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行签到
        env:
          HCN_ACCOUNTS: ${{ secrets.HCN_ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python -u private-scripts/hcnsec/hcnsec_checkin.py

      - name: 🧹 清理旧的工作流运行记录（仅保留最新1条）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          runs=$(gh run list --repo "$REPO" --workflow="hcnsec-checkin.yml" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete "$run_id" --repo "$REPO" || true
            fi
          done
